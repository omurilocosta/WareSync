<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waresync — Consultar Vendas</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
<style>
  .filtros-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 14px 16px; }
  .filtros-grid input, .filtros-grid select { border: 1px solid var(--color-border); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: var(--font-sans); }
  .badge-status { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 6px; }
  .badge-finalizada { background: #EAF3DE; color: #3B6D11; }
  .badge-cancelada { background: #FCEBEB; color: #B02A2A; }
  .badge-aberta { background: #FAEEDA; color: #854F0B; }
</style>
</head>
<body data-page="vendas-consulta.html">

<div class="app-shell" id="app-shell"></div>

<div class="modal-overlay" id="detalheModal">
  <div class="modal-card" style="max-width:560px">
    <h2 class="modal-title" id="detalheTitulo"></h2>
    <div id="detalheConteudo"></div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="fecharDetalheBtn">Fechar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cancelarModal">
  <div class="modal-card">
    <h2 class="modal-title">Cancelar venda</h2>
    <div class="form-error" id="cancelarFormError"></div>
    <form id="cancelarForm">
      <input type="hidden" id="cancelarVendaId" />
      <div class="field">
        <label for="motivoCancelamento">Motivo do cancelamento *</label>
        <input type="text" id="motivoCancelamento" placeholder="Ex: cliente desistiu da compra" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelarVoltarBtn">Voltar</button>
        <button type="submit" class="btn-primary">Confirmar cancelamento</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="devolucaoModal">
  <div class="modal-card">
    <h2 class="modal-title">Registrar devolução</h2>
    <div class="form-error" id="devolucaoFormError"></div>
    <form id="devolucaoForm">
      <input type="hidden" id="devolucaoVendaId" />
      <div class="field">
        <label>Item a devolver</label>
        <select id="devolucaoItem" style="width:100%;border:1px solid var(--color-border);border-radius:8px;padding:10px;font-family:var(--font-sans)"></select>
      </div>
      <div class="field">
        <label for="devolucaoQtd">Quantidade</label>
        <input type="number" id="devolucaoQtd" min="1" step="1" />
      </div>
      <div class="field">
        <label for="devolucaoMotivo">Motivo (opcional)</label>
        <input type="text" id="devolucaoMotivo" placeholder="Ex: produto com defeito" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="devolucaoVoltarBtn">Voltar</button>
        <button type="submit" class="btn-primary">Confirmar devolução</button>
      </div>
    </form>
  </div>
</div>

<script src="js/shell.js"></script>
<script src="js/vendas-consulta.js"></script>
</body>
</html>
