<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waresync — Redefinir senha</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark">W</div>
      <span class="auth-logo-text">Waresync</span>
    </div>

    <div id="formView">
      <h1 class="auth-title">Definir nova senha</h1>
      <p class="auth-subtitle">Escolha uma nova senha para sua conta</p>

      <div class="form-error" id="formError"></div>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="novaSenha">Nova senha</label>
          <div class="password-wrap">
            <input type="password" id="novaSenha" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" />
            <button type="button" class="toggle-password" id="toggleLabel">mostrar</button>
          </div>
        </div>

        <div class="field">
          <label for="confirmarSenha">Confirmar nova senha</label>
          <input type="password" id="confirmarSenha" placeholder="Digite novamente" autocomplete="new-password" />
        </div>

        <button type="submit" class="btn-primary" id="resetButton">Salvar nova senha</button>
      </form>
    </div>

    <div id="successView" style="display:none">
      <h1 class="auth-title">Senha redefinida!</h1>
      <p class="auth-subtitle">Você já pode entrar com a nova senha.</p>
      <a href="login.html" class="btn-primary" style="display:block;text-align:center;text-decoration:none">Ir para o login</a>
    </div>

    <div id="invalidView" style="display:none">
      <h1 class="auth-title">Link inválido</h1>
      <p class="auth-subtitle">Este link de redefinição não foi encontrado. Solicite um novo pelo login.</p>
      <a href="login.html" class="btn-primary" style="display:block;text-align:center;text-decoration:none">Voltar ao login</a>
    </div>
  </div>
</div>

<script src="js/reset-password.js"></script>
</body>
</html>
