<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waresync — Financeiro</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
<style>
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-border); margin-bottom: 16px; }
  .tab-btn { background: none; border: none; padding: 10px 16px; font-size: 13px; font-weight: 500; color: var(--color-text-faint); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--color-primary); border-color: var(--color-primary); }
  .badge-status { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 6px; }
  .badge-aberta { background: #FAEEDA; color: #854F0B; }
  .badge-paga, .badge-recebido { background: #EAF3DE; color: #3B6D11; }
  .badge-pendente { background: #FAEEDA; color: #854F0B; }
  .caixa-box { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-card); box-shadow: var(--shadow-soft); padding: 20px; margin-bottom: 16px; }
</style>
</head>
<body data-page="financeiro.html">

<div class="app-shell" id="app-shell"></div>

<div class="modal-overlay" id="genericModal">
  <div class="modal-card">
    <h2 class="modal-title" id="genericModalTitle"></h2>
    <div class="form-error" id="genericFormError"></div>
    <form id="genericForm"></form>
  </div>
</div>

<script src="js/shell.js"></script>
<script src="js/financeiro.js"></script>
</body>
</html>
