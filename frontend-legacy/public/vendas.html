<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waresync — PDV</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
<style>
  .pdv-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
  .search-results { border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-top: 8px; max-height: 220px; overflow-y: auto; display: none; }
  .search-results.show { display: block; }
  .search-result-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; cursor: pointer; font-size: 13px; }
  .search-result-item:hover { background: var(--color-surface-muted); }
  .search-result-item .out { color: var(--color-danger-text); font-size: 11px; }
  .cart-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--color-border); font-size: 13px; }
  .cart-item:last-child { border-bottom: none; }
  .cart-item .qty { width: 60px; }
  .cart-item .qty input { width: 100%; border: 1px solid var(--color-border); border-radius: 6px; padding: 6px; text-align: center; font-family: var(--font-sans); }
  .cart-item .remove { background: none; border: none; color: var(--color-danger-text); cursor: pointer; font-size: 16px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--color-text-faint); margin-bottom: 8px; }
  .summary-total { display: flex; justify-content: space-between; font-size: 17px; font-weight: 600; padding-top: 10px; border-top: 1px solid var(--color-border); margin-top: 8px; }
</style>
</head>
<body data-page="vendas.html">

<div class="app-shell" id="app-shell"></div>

<script src="js/shell.js"></script>
<script src="js/vendas.js"></script>
</body>
</html>
