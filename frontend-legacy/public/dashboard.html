<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waresync — Painel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
<style>
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-card); box-shadow: var(--shadow-soft); padding: 16px; }
  .card.pending { background: var(--color-surface-muted); border-style: dashed; }
  .kpi-label { font-size: 12px; color: var(--color-text-faint); margin: 0 0 6px; }
  .kpi-value { font-size: 24px; font-weight: 600; margin: 0; }
  .kpi-value.pending { font-size: 13px; font-weight: 500; color: var(--color-text-faint); }
  .kpi-hint { font-size: 12px; margin: 4px 0 0; color: var(--color-text-faint); }
  .badge-warning { background: #FAEEDA; color: #854F0B; font-size: 11px; padding: 3px 10px; border-radius: 6px; }
</style>
</head>
<body data-page="dashboard.html">

<div class="app-shell" id="app-shell"></div>

<script src="js/shell.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
