<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waresync — Fiscal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
<style>
  .aviso-simulacao { background: #FAEEDA; border: 1px solid #E8C97A; color: #854F0B; font-size: 12px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
  .badge-status { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 6px; }
  .badge-autorizado { background: #EAF3DE; color: #3B6D11; }
  .badge-cancelado { background: #FCEBEB; color: #B02A2A; }
  .badge-pendente { background: #FAEEDA; color: #854F0B; }
  .badge-rejeitado { background: #FCEBEB; color: #B02A2A; }
  .filtros-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 14px 16px; }
  .filtros-grid input, .filtros-grid select { border: 1px solid var(--color-border); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: var(--font-sans); }
</style>
</head>
<body data-page="fiscal.html">

<div class="app-shell" id="app-shell"></div>

<div class="modal-overlay" id="emitirModal">
  <div class="modal-card">
    <h2 class="modal-title">Emitir documento fiscal</h2>
    <div class="form-error" id="emitirFormError"></div>
    <form id="emitirForm">
      <div class="field">
        <label for="vendaIdEmitir">Número da venda</label>
        <input type="number" id="vendaIdEmitir" placeholder="Ex: 12" />
      </div>
      <div class="field">
        <label for="tipoDocumento">Tipo de documento</label>
        <select id="tipoDocumento" style="width:100%;border:1px solid var(--color-border);border-radius:8px;padding:10px;font-family:var(--font-sans)">
          <option value="NFE">NF-e</option>
          <option value="NFCE">NFC-e</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="emitirVoltarBtn">Cancelar</button>
        <button type="submit" class="btn-primary">Emitir</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="cancelarFiscalModal">
  <div class="modal-card">
    <h2 class="modal-title">Cancelar documento fiscal</h2>
    <div class="form-error" id="cancelarFiscalError"></div>
    <form id="cancelarFiscalForm">
      <input type="hidden" id="cancelarFiscalId" />
      <div class="field">
        <label for="motivoCancelamentoFiscal">Motivo *</label>
        <input type="text" id="motivoCancelamentoFiscal" placeholder="Motivo do cancelamento" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelarFiscalVoltarBtn">Voltar</button>
        <button type="submit" class="btn-primary">Confirmar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/shell.js"></script>
<script src="js/fiscal.js"></script>
</body>
</html>
